name: Docs

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # Before the build, so a misconfigured Pages site fails in seconds rather than
      # after a full npm ci. The site is built with a relative base, so none of this
      # action's path outputs are needed by the build itself.
      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build documentation
        working-directory: docs
        run: |
          npm ci
          npm run typecheck
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # The action's 10 minute default aborts *and cancels* a deployment that
          # GitHub's Pages backend is still working through; first deploys of this
          # site consistently needed ~12 minutes to go live.
          timeout: 1800000
