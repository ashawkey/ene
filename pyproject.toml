[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ene-agent"
version = "0.1.2"
description = "Terminal-based AI coding agent with reusable skills, personas, and a Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ashawkey"}]
dependencies = [
  "beautifulsoup4",
  "ddgs",
  "fastapi",
  "filelock",
  "httpcore",
  "httpx[socks]",
  "markdown-it-py",
  "openai",
  "pathspec",
  "prompt-toolkit",
  "pygments",
  "pyyaml",
  "questionary",
  "rich",
  "starlette",
  "uvicorn",
  "websockets",
]

[project.urls]
Homepage = "https://github.com/ashawkey/ene"
Repository = "https://github.com/ashawkey/ene"
Issues = "https://github.com/ashawkey/ene/issues"
Documentation = "https://ashawkey.github.io/ene/"

[project.scripts]
ene = "ene.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ene*"]

[tool.setuptools.package-data]
ene = [
  "bundled_skills/**/*",
  "bundled_personas/**/*",
  "frontend/dist/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.py[cod]"]
